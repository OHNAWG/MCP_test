<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>키보드 입력 테스트</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            max-width: 800px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .display-area {
            background: #fafafa;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: center;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .last-key {
            font-size: 48px;
            font-weight: bold;
            color: #333;
            letter-spacing: 10px;
            font-family: 'Courier New', monospace;
        }

        .last-key.empty {
            color: #999;
            font-size: 14px;
            letter-spacing: 0;
            font-weight: normal;
        }

        .keyboard-section {
            margin-bottom: 20px;
        }

        .keyboard-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(40px, 1fr));
            gap: 6px;
            margin-bottom: 6px;
        }

        .keyboard-row.spacebar {
            grid-template-columns: 1fr;
        }

        .key {
            background: white;
            border: 1px solid #d0d0d0;
            border-radius: 6px;
            padding: 12px 8px;
            font-size: 12px;
            font-weight: 500;
            color: #333;
            cursor: pointer;
            text-align: center;
            user-select: none;
            transition: all 0.1s ease;
            line-height: 1.2;
        }

        .key:hover {
            background: #f9f9f9;
            border-color: #999;
        }

        .key:active {
            background: #0066cc;
            color: white;
            border-color: #0052a3;
            transform: scale(0.98);
        }

        .key.pressed {
            background: #0066cc;
            color: white;
            border-color: #0052a3;
        }

        .key.wide {
            padding: 12px 16px;
        }

        .spacebar {
            padding: 12px !important;
        }

        .stats {
            background: #fafafa;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            font-size: 14px;
            color: #666;
        }

        .stat-item {
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .stat-item:last-child {
            margin-bottom: 0;
        }

        .stat-label {
            font-weight: 500;
            color: #333;
        }

        .stat-value {
            color: #0066cc;
            font-weight: 600;
            font-family: 'Courier New', monospace;
        }

        .clear-btn {
            width: 100%;
            margin-top: 15px;
            padding: 10px;
            background: #f0f0f0;
            border: 1px solid #d0d0d0;
            border-radius: 6px;
            color: #333;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.1s ease;
            font-size: 14px;
        }

        .clear-btn:hover {
            background: #e0e0e0;
        }

        .clear-btn:active {
            transform: scale(0.98);
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 22px;
            }

            .last-key {
                font-size: 36px;
                letter-spacing: 5px;
            }

            .key {
                padding: 10px 6px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⌨️ 키보드 입력 테스트</h1>
        <p class="subtitle">키보드를 누르거나 아래 버튼을 클릭하세요</p>

        <div class="display-area">
            <div class="last-key empty" id="displayKey">키 입력 대기 중...</div>
        </div>

        <div class="keyboard-section">
            <div class="keyboard-row">
                <div class="key" data-key="Escape">ESC</div>
                <div class="key" data-key="F1">F1</div>
                <div class="key" data-key="F2">F2</div>
                <div class="key" data-key="F3">F3</div>
                <div class="key" data-key="F4">F4</div>
                <div class="key" data-key="F5">F5</div>
                <div class="key" data-key="F6">F6</div>
                <div class="key" data-key="F7">F7</div>
                <div class="key" data-key="F8">F8</div>
                <div class="key" data-key="F9">F9</div>
                <div class="key" data-key="F10">F10</div>
                <div class="key" data-key="F11">F11</div>
                <div class="key" data-key="F12">F12</div>
            </div>

            <div class="keyboard-row">
                <div class="key" data-key="`">~</div>
                <div class="key" data-key="1">1</div>
                <div class="key" data-key="2">2</div>
                <div class="key" data-key="3">3</div>
                <div class="key" data-key="4">4</div>
                <div class="key" data-key="5">5</div>
                <div class="key" data-key="6">6</div>
                <div class="key" data-key="7">7</div>
                <div class="key" data-key="8">8</div>
                <div class="key" data-key="9">9</div>
                <div class="key" data-key="0">0</div>
                <div class="key" data-key="-">-</div>
                <div class="key" data-key="=">=</div>
                <div class="key wide" data-key="Backspace">BACK</div>
            </div>

            <div class="keyboard-row">
                <div class="key wide" data-key="Tab">TAB</div>
                <div class="key" data-key="q">Q</div>
                <div class="key" data-key="w">W</div>
                <div class="key" data-key="e">E</div>
                <div class="key" data-key="r">R</div>
                <div class="key" data-key="t">T</div>
                <div class="key" data-key="y">Y</div>
                <div class="key" data-key="u">U</div>
                <div class="key" data-key="i">I</div>
                <div class="key" data-key="o">O</div>
                <div class="key" data-key="p">P</div>
                <div class="key" data-key="[">[</div>
                <div class="key" data-key="]">]</div>
                <div class="key wide" data-key="\">\ </div>
            </div>

            <div class="keyboard-row">
                <div class="key wide" data-key="CapsLock">CAPS</div>
                <div class="key" data-key="a">A</div>
                <div class="key" data-key="s">S</div>
                <div class="key" data-key="d">D</div>
                <div class="key" data-key="f">F</div>
                <div class="key" data-key="g">G</div>
                <div class="key" data-key="h">H</div>
                <div class="key" data-key="j">J</div>
                <div class="key" data-key="k">K</div>
                <div class="key" data-key="l">L</div>
                <div class="key" data-key=";">;</div>
                <div class="key" data-key="'">'</div>
                <div class="key wide" data-key="Enter">ENTER</div>
            </div>

            <div class="keyboard-row">
                <div class="key wide" data-key="Shift">SHIFT</div>
                <div class="key" data-key="z">Z</div>
                <div class="key" data-key="x">X</div>
                <div class="key" data-key="c">C</div>
                <div class="key" data-key="v">V</div>
                <div class="key" data-key="b">B</div>
                <div class="key" data-key="n">N</div>
                <div class="key" data-key="m">M</div>
                <div class="key" data-key=",">,</div>
                <div class="key" data-key=".">.</div>
                <div class="key" data-key="/">/</div>
                <div class="key wide" data-key="Shift">SHIFT</div>
            </div>

            <div class="keyboard-row">
                <div class="key" data-key="Control">CTRL</div>
                <div class="key" data-key="Meta">WIN</div>
                <div class="key" data-key="Alt">ALT</div>
                <div class="key spacebar" data-key=" ">SPACE</div>
                <div class="key" data-key="Alt">ALT</div>
                <div class="key" data-key="Meta">WIN</div>
                <div class="key" data-key="Control">CTRL</div>
            </div>
        </div>

        <div class="stats">
            <div class="stat-item">
                <span class="stat-label">마지막 입력 키:</span>
                <span class="stat-value" id="lastKeyCode">없음</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">총 입력 횟수:</span>
                <span class="stat-value" id="totalKeys">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">입력 상태:</span>
                <span class="stat-value" id="status">대기 중</span>
            </div>
            <button class="clear-btn" onclick="clearStats()">초기화</button>
        </div>
    </div>

    <script>
        let totalKeyCount = 0;
        const displayKey = document.getElementById('displayKey');
        const lastKeyCodeEl = document.getElementById('lastKeyCode');
        const totalKeysEl = document.getElementById('totalKeys');
        const statusEl = document.getElementById('status');

        // 실제 키보드 입력 감지
        document.addEventListener('keydown', (e) => {
            updateKeyDisplay(e.key || e.code);
            highlightKey(e.key || e.code);
            totalKeyCount++;
            updateStats();
        });

        document.addEventListener('keyup', (e) => {
            removeKeyHighlight(e.key || e.code);
        });

        // 버튼 클릭 이벤트
        document.querySelectorAll('.key').forEach(button => {
            button.addEventListener('click', (e) => {
                const key = button.dataset.key;
                updateKeyDisplay(key);
                button.classList.add('pressed');
                totalKeyCount++;
                updateStats();
                setTimeout(() => {
                    button.classList.remove('pressed');
                }, 100);
            });
        });

        function updateKeyDisplay(key) {
            const displayText = key === ' ' ? '⎵ SPACE' : key.toUpperCase();
            displayKey.textContent = displayText;
            displayKey.classList.remove('empty');
            lastKeyCodeEl.textContent = key;
            statusEl.textContent = '입력됨';
        }

        function highlightKey(key) {
            document.querySelectorAll('.key').forEach(btn => {
                if (btn.dataset.key.toLowerCase() === key.toLowerCase() || btn.dataset.key === key) {
                    btn.classList.add('pressed');
                }
            });
        }

        function removeKeyHighlight(key) {
            document.querySelectorAll('.key').forEach(btn => {
                if (btn.dataset.key.toLowerCase() === key.toLowerCase() || btn.dataset.key === key) {
                    btn.classList.remove('pressed');
                }
            });
        }

        function updateStats() {
            totalKeysEl.textContent = totalKeyCount;
        }

        function clearStats() {
            totalKeyCount = 0;
            displayKey.textContent = '키 입력 대기 중...';
            displayKey.classList.add('empty');
            lastKeyCodeEl.textContent = '없음';
            totalKeysEl.textContent = '0';
            statusEl.textContent = '초기화됨';
        }
    </script>
</body>
</html>
